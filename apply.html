<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire Purchase Application | Treasure Rock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="max-w-3xl mx-auto px-4 py-10 sm:py-16">
        <a href="index.html" class="text-sm font-medium text-blue-700 hover:text-blue-800">&larr; Treasure Rock dashboard</a>
        <section class="mt-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-9">
            <h1 class="text-2xl font-bold text-slate-900">Hire Purchase Application</h1>
            <p class="mt-2 text-sm text-slate-600">Complete the form and our team will contact you about your application.</p>
            <form name="hire-purchase" method="POST" action="/application-submitted.html" data-netlify="true" netlify-honeypot="bot-field" class="mt-8 space-y-5">
                <input type="hidden" name="form-name" value="hire-purchase">
                <p class="hidden">
                    <label>Leave this field empty: <input name="bot-field"></label>
                </p>
                <div>
                    <label for="full_name" class="block text-sm font-medium mb-1">Full name</label>
                    <input id="full_name" name="full_name" autocomplete="name" required maxlength="120" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                        <label for="email" class="block text-sm font-medium mb-1">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium mb-1">Phone number</label>
                        <input id="phone" name="phone" type="tel" autocomplete="tel" required maxlength="30" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
                <div>
                    <label for="address" class="block text-sm font-medium mb-1">Residential address</label>
                    <textarea id="address" name="address" autocomplete="street-address" required maxlength="500" rows="2" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
                </div>
                <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                        <label for="product" class="block text-sm font-medium mb-1">Product of interest</label>
                        <input id="product" name="product" required maxlength="160" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label for="employer" class="block text-sm font-medium mb-1">Employer / occupation</label>
                        <input id="employer" name="employer" required maxlength="160" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                </div>
                <div class="grid sm:grid-cols-3 gap-5">
                    <div>
                        <label for="monthly_income" class="block text-sm font-medium mb-1">Monthly income (GH₵)</label>
                        <input id="monthly_income" name="monthly_income" type="number" min="0" step="0.01" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label for="deposit" class="block text-sm font-medium mb-1">Proposed deposit (GH₵)</label>
                        <input id="deposit" name="deposit" type="number" min="0" step="0.01" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    </div>
                    <div>
                        <label for="repayment_months" class="block text-sm font-medium mb-1">Repayment term</label>
                        <select id="repayment_months" name="repayment_months" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
                            <option value="">Choose term</option>
                            <option value="3">3 months</option>
                            <option value="6">6 months</option>
                            <option value="9">9 months</option>
                            <option value="12">12 months</option>
                            <option value="18">18 months</option>
                            <option value="24">24 months</option>
                        </select>
                    </div>
                </div>
                <p class="text-xs text-slate-500">By submitting, you agree that Treasure Rock may use these details to assess and contact you about this application. Do not submit bank passwords or payment card details.</p>
                <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg">Submit application</button>
            </form>
        </section>
    </main>
</body>
</html>
